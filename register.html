<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Auto Parts</title>
  <meta name="description" content="Create an Auto Parts account to save vehicles to your digital garage, track orders, unlock trade discounts, and enjoy fast fitment lookups.">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23f95716'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css" id="rtl-stylesheet" disabled>
</head>
<body class="auth-body">

  <!-- Top Right Toggles -->
  <div style="position: absolute; top: var(--space-3); right: var(--space-3); display: flex; gap: var(--space-2); z-index: 10;">
    <button class="btn-icon rtl-toggle-btn" aria-label="Toggle RTL Direction" title="Toggle RTL">
      <i class="ri-arrow-left-right-line"></i>
    </button>
    <button class="btn-icon theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
      <i class="ri-moon-line"></i>
    </button>
  </div>

  <main class="auth-card" id="register-container" style="max-width: 480px;">
    <!-- Brand Header -->
    <a href="index.html" class="auth-brand">
      <i class="ri-steering-2-fill"></i>
      <span>AUTO<span style="color: var(--color-accent);">PARTS</span></span>
    </a>
    <h2>Create Your Account</h2>
    <p class="auth-subtext">Join over 250,000 drivers and access wholesale garage pricing.</p>

    <!-- Client-Validated Register Form (Step 9.8 & 12) -->
    <form id="register-form" class="auth-form" data-validate="true" data-success-msg="Account registered successfully! Redirecting to login...">
      <!-- Full Name -->
      <div class="form-field">
        <label for="reg-name" style="font-size: var(--size-caption); font-weight: 500;">Full Name *</label>
        <input type="text" id="reg-name" name="name" class="form-control" placeholder="Jordan Miller" required autocomplete="name">
        <span class="error-msg"></span>
      </div>

      <!-- Email -->
      <div class="form-field">
        <label for="reg-email" style="font-size: var(--size-caption); font-weight: 500;">Email Address *</label>
        <input type="email" id="reg-email" name="email" class="form-control" placeholder="jordan@example.com" required autocomplete="email">
        <span class="error-msg"></span>
      </div>

      <!-- Password & Confirm Password side by side -->
      <div class="form-grid-2" style="margin-bottom: 0;">
        <div class="form-field">
          <label for="reg-password" style="font-size: var(--size-caption); font-weight: 500;">Password (8+ chars) *</label>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <span class="error-msg"></span>
        </div>

        <div class="form-field">
          <label for="reg-confirm-password" style="font-size: var(--size-caption); font-weight: 500;">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" name="confirm_password" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <span class="error-msg"></span>
        </div>
      </div>

      <!-- Terms & Conditions Checkbox (Step 9.8 Requirement) -->
      <div class="form-field">
        <label class="form-checkbox">
          <input type="checkbox" name="terms" id="reg-terms" required>
          <span style="font-size: var(--size-caption);">I accept the Terms & Conditions and privacy policy</span>
        </label>
        <span class="error-msg"></span>
      </div>

      <!-- Primary Register Button labeled exactly 'Register' per Step 9.8 -->
      <button type="submit" class="btn btn-primary" id="btn-register" style="width: 100%; margin-top: var(--space-1);">
        Register
      </button>

      <div class="form-feedback"></div>
    </form>

    <div class="auth-divider">Or Continue With</div>

    <!-- Continue with Google (Official icon) -->
    <button type="button" class="social-auth-btn" id="btn-google-reg">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.92 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Continue with Apple (Official icon) -->
    <button type="button" class="social-auth-btn" id="btn-apple-reg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.61 1.34-.56.64-1.04 1.7-0.91 2.73 1 .08 2.03-.51 2.59-1.22z"/>
      </svg>
      Continue with Apple
    </button>

    <!-- Link back to Login page -->
    <div class="auth-switch">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
